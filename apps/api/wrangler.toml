name = "weddingkit-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"

# Buat dulu: wrangler hyperdrive create weddingkit --connection-string="<DIRECT connection string Supabase>"
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# Keep-alive agar project Supabase free tidak di-pause (idle 1 minggu): ping harian.
[triggers]
crons = ["0 3 * * *"]

# Dev lokal: buat apps/api/.dev.vars berisi DATABASE_URL=...
